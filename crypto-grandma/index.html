<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A simple guide to Bitcoin and crypto</title>
  <style>
    :root {
      --page: #FBF7F0;
      --card: #FFFFFF;
      --border: #D9D2C5;
      --text: #1F2430;
      --muted: #4A5160;
      --primary: #1A4F8C;
      --primary-border: #0F3D73;
      --on-primary: #FFFFFF;
      --correct-bg: #E6F3EA;
      --correct-text: #165C30;
      --wrong-bg: #F8E6E2;
      --wrong-text: #8A2A1F;
      --caution-bg: #FFF1D6;
      --caution-text: #643C00;
      --caution-bar: #E0A030;
      --focus: #F2A900;
      --bitcoin: #E8912D;
      --bar-track: #D9D2C5;
      --bar-fill: #1A4F8C;
      --space: 1.5rem;
      --max: 42.5rem;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 1.375rem;
      font-weight: 400;
      line-height: 1.55;
    }

    @media (max-width: 30rem) {
      body { font-size: 1.25rem; }
    }

    img, svg { max-width: 100%; height: auto; display: block; }

    button {
      font: inherit;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
      color: inherit;
      background: none;
      border: 0;
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 0.25rem solid var(--focus);
      outline-offset: 0.125rem;
    }

    .shell {
      max-width: var(--max);
      margin: 0 auto;
      padding: var(--space);
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chrome-top {
      flex-shrink: 0;
      background: var(--page);
    }

    .pane {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 0.5rem;
    }

    .banner {
      text-align: center;
      margin: 0 0 1.25rem;
    }

    .banner h1 {
      margin: 0 0 0.4rem;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
    }

    @media (max-width: 30rem) {
      .banner h1 { font-size: 1.625rem; }
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 600;
    }

    @media (max-width: 30rem) {
      .subtitle { font-size: 1.125rem; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .how {
      margin: 0 0 1.5rem;
      color: var(--muted);
      max-width: 60ch;
    }

    .lesson-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .lesson-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--border);
      padding: 1.1rem 1.25rem;
      min-height: 4rem;
    }

    .lesson-card:hover { border-color: var(--primary); }

    .lesson-kicker {
      display: block;
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .lesson-title {
      display: block;
      font-size: 1.375rem;
      font-weight: 700;
    }

    .lesson-status {
      display: block;
      margin-top: 0.35rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--muted);
    }

    .progress-wrap {
      margin: 0 0 1.25rem;
    }

    .progress-label {
      margin: 0 0 0.5rem;
      font-weight: 600;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .progress-bar {
      height: 0.75rem;
      background: var(--bar-track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--bar-fill);
      width: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .progress-bar > span { transition: width 200ms ease; }
    }

    .top-row {
      display: flex;
      justify-content: flex-start;
      margin: 0 0 1rem;
    }

    .btn-back {
      min-height: 3.5rem;
      min-width: 3.5rem;
      padding: 0.5rem 1rem;
      background: var(--card);
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .screen-text {
      max-width: 60ch;
      margin: 0 0 1rem;
    }

    .screen-text p { margin: 0 0 0.8rem; }
    .screen-text p:last-child { margin-bottom: 0; }

    .illustration {
      width: 7.5rem;
      margin: 0 0 1.25rem;
    }

    .illustration svg { width: 100%; height: auto; }

    .caution {
      background: var(--caution-bg);
      color: var(--caution-text);
      border-left: 4px solid var(--caution-bar);
      padding: 1rem 1.15rem;
      border-radius: 0 0.75rem 0.75rem 0;
      max-width: 60ch;
    }

    .caution .kicker {
      margin: 0 0 0.4rem;
      font-weight: 700;
      font-size: 1.125rem;
    }

    .caution .screen-text { margin: 0; color: var(--caution-text); }

    .quiz-q {
      margin: 0 0 0.85rem;
      font-size: 1.625rem;
      font-weight: 700;
      line-height: 1.3;
      max-width: 60ch;
    }
    @media (max-width: 30rem) {
      .quiz-q { font-size: 1.375rem; }
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 0 0 1.25rem;
    }

    .option {
      width: 100%;
      min-height: 4rem;
      text-align: left;
      background: var(--card);
      border: 2px solid var(--border);
      padding: 1rem 1.15rem;
    }

    .option[aria-pressed="true"] { border-color: var(--primary); }

    .option.is-correct {
      background: var(--correct-bg);
      color: var(--correct-text);
      border-color: var(--correct-text);
    }

    .option.is-wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
      border-color: var(--wrong-text);
    }

    .option:disabled { cursor: default; }

    .feedback {
      border-radius: 0.75rem;
      padding: 1rem 1.15rem;
      margin: 0 0 1.25rem;
      max-width: 60ch;
    }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .feedback.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .feedback strong { display: block; margin-bottom: 0.35rem; font-size: 1.375rem; }

    .complete {
      text-align: center;
      padding: 1rem 0 1.5rem;
    }

    .complete h2 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      font-weight: 700;
    }

    .complete p {
      margin: 0 auto;
      max-width: 60ch;
    }

    .actions {
      flex-shrink: 0;
      margin-top: 0;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--page);
    }

    .btn-primary {
      width: 100%;
      min-height: 4rem;
      background: var(--primary);
      color: var(--on-primary);
      border: 3px solid var(--primary-border);
    }

    .btn-secondary {
      width: 100%;
      min-height: 3.5rem;
      background: var(--card);
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 48rem) {
      .actions { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="banner">
      <h1>A simple guide to Bitcoin and crypto</h1>
      <p class="subtitle">Practice only. No real money.</p>
    </header>
    <main id="app"></main>
  </div>

  <script>
    const LESSONS = {"version":1,"lessons":[{"id":"what-is-bitcoin","title":"What is Bitcoin?","screens":["Bitcoin is a kind of digital money. It lives on computers, not in your purse.","No bank or government runs Bitcoin. Thousands of computers around the world keep the records together.","Those computers share one big record book, called the blockchain. It lists every Bitcoin payment ever made.","There will only ever be 21 million bitcoins. That limit is written into Bitcoin's rules.","You don't have to buy a whole bitcoin. You can buy a small piece, like $10 worth.","Bitcoin's price goes up and down a lot, sometimes in a single day. Only ever use money you could afford to lose.","Bitcoin started in 2009. It was created by a person or group using the name Satoshi Nakamoto, and nobody knows for sure who that is."],"quiz":[{"q":"Who runs Bitcoin?","options":["A big bank","The government","Many computers around the world, together"],"answer":2,"explanation":"No single company or government is in charge. Many computers share the work."},{"q":"Do you have to buy a whole bitcoin?","options":["Yes, always","No, you can buy a small piece"],"answer":1,"explanation":"You can buy a small piece, like $10 or $50 worth."},{"q":"How many bitcoins will there ever be?","options":["As many as people want","21 million","1 billion"],"answer":1,"explanation":"Bitcoin's rules cap it at 21 million coins."}],"checkedOn":"2026-11-26","checkedBy":"Satoshi"},{"id":"spotting-scams","title":"Spotting crypto scams","screens":["Crypto scams are common. Knowing a few warning signs will keep you safe.","Never share your passwords, codes, or your 'secret words' (sometimes called a seed phrase) with anyone. Anyone who has them can take your money.","No real company, bank, or helper will ever ask for your secret words. If someone asks, it is a scam.","Be careful of anyone who promises 'guaranteed' profits or says you can 'double your money.' Real investments never promise that.","Scammers rush you. If someone says you must act today, stop and hang up.","Watch out for a new online friend or sweetheart who brings up crypto. That's a common scam.","Nobody can 'unlock' or 'recover' money you've lost if you pay them a fee first. Those offers are scams too.","If something feels wrong, stop and ask a family member you trust before you do anything. In this app you're only practising, so your real money is always safe here."],"quiz":[{"q":"Someone on the phone says they're from 'Bitcoin support' and asks for your secret words. What do you do?","options":["Read the words to them","Hang up. It's a scam","Ask them to call back later"],"answer":1,"explanation":"Nobody real ever needs your secret words. Hang up."},{"q":"An ad promises you'll 'double your money in a week, guaranteed.' This is:","options":["A great deal","Probably a scam"],"answer":1,"explanation":"Guaranteed big profits are a classic sign of a scam."},{"q":"What's the best thing to do when something feels wrong?","options":["Act fast before you miss out","Stop and ask someone you trust"],"answer":1,"explanation":"Slow down. Scammers rely on rushing you."}],"checkedOn":"2026-11-26","checkedBy":"Satoshi"},{"id":"buying-and-selling","title":"What buying and selling means","screens":["Buying Bitcoin means trading your dollars for a piece of Bitcoin.","Selling means trading your Bitcoin back into dollars.","The price changes all day, every day. What you pay depends on the price at the moment you buy.","If the price goes up after you buy, your Bitcoin is worth more. If it goes down, it's worth less.","You only make or lose money for real when you sell. Until then, it's just the current value.","Most places that sell crypto charge a small fee each time you buy or sell. Our practice wallet does this too, so it feels realistic.","In this app you'll practise with pretend money. Nothing you do here costs real dollars."],"quiz":[{"q":"What does 'selling' Bitcoin mean?","options":["Trading Bitcoin back into dollars","Giving it away for free"],"answer":0,"explanation":"Selling turns your Bitcoin back into dollars."},{"q":"You buy $100 of Bitcoin and the price goes down. Your Bitcoin is now worth:","options":["More than $100","Less than $100","Exactly $100"],"answer":1,"explanation":"When the price drops, what you hold is worth less."},{"q":"Does the practice wallet use real money?","options":["Yes","No, it's pretend money"],"answer":1,"explanation":"Everything here is pretend, so you can learn safely."}],"checkedOn":"2026-11-26","checkedBy":"Satoshi"}]};

    const STORAGE_KEY = "crypto-grandma-v1";
    const lessons = LESSONS.lessons;

    const ICONS = {
      "what-is-bitcoin": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle cx="60" cy="60" r="42" fill="#FFFFFF" stroke="#1F2430" stroke-width="3"/><circle cx="60" cy="60" r="30" fill="#FBF7F0" stroke="#1F2430" stroke-width="3"/><text x="60" y="72" text-anchor="middle" font-size="36" font-weight="700" fill="#E8912D" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">B</text></svg>`,
      "spotting-scams": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path d="M60 18l38 14v28c0 24-16 40-38 48C38 100 22 84 22 60V32z" fill="#FFF1D6" stroke="#1F2430" stroke-width="3" stroke-linejoin="round"/><path d="M42 62l12 12 24-26" fill="none" stroke="#165C30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      "buying-and-selling": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="18" y="38" width="38" height="28" rx="6" fill="#FFFFFF" stroke="#1F2430" stroke-width="3"/><rect x="64" y="54" width="38" height="28" rx="6" fill="#FBF7F0" stroke="#1F2430" stroke-width="3"/><path d="M44 28h0c10 0 18 8 18 16" fill="none" stroke="#1A4F8C" stroke-width="3" stroke-linecap="round"/><path d="M56 22l6 10-12 0z" fill="#1A4F8C" stroke="#1F2430" stroke-width="1.5"/><path d="M76 92h0c-10 0-18-8-18-16" fill="none" stroke="#1A4F8C" stroke-width="3" stroke-linecap="round"/><path d="M64 98l-6-10 12 0z" fill="#1A4F8C" stroke="#1F2430" stroke-width="1.5"/><text x="37" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2430" font-family="Arial,sans-serif">$</text><circle cx="83" cy="68" r="8" fill="none" stroke="#E8912D" stroke-width="3"/></svg>`
    };

    function defaultState() {
      return {
        view: "home",
        lessonId: null,
        screen: 0,
        quizIndex: 0,
        selected: null,
        revealed: false,
        started: {},
        done: {},
        answers: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const data = JSON.parse(raw);
        return { ...defaultState(), ...data };
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      const toSave = {
        view: state.view,
        lessonId: state.lessonId,
        screen: state.screen,
        quizIndex: state.quizIndex,
        selected: state.selected,
        revealed: state.revealed,
        started: state.started,
        done: state.done,
        answers: state.answers
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    let state = loadState();

    function lessonById(id) {
      return lessons.find((l) => l.id === id);
    }

    function lessonIndex(id) {
      return lessons.findIndex((l) => l.id === id);
    }

    function statusFor(id) {
      if (state.done[id]) return "Done";
      if (state.started[id]) return "In progress";
      return "Not started";
    }

    function goHome() {
      persistAll();
      state.view = "home";
      state.lessonId = null;
      state.selected = null;
      state.revealed = false;
      saveState();
      render();
    }

    // Keep per-lesson progress so switching lessons doesn't lose her place.
    const lessonProgress = {};

    function storeProgress() {
      if (!state.lessonId) return;
      if (!state.answers[state.lessonId]) state.answers[state.lessonId] = {};
      lessonProgress[state.lessonId] = {
        screen: state.screen,
        quizIndex: state.quizIndex,
        selected: state.selected,
        revealed: state.revealed,
        view: state.view
      };
    }

    function persistAll() {
      storeProgress();
      state.progress = Object.assign(state.progress || {}, lessonProgress);
      saveState();
    }

    // Restore per-lesson place after a reload.
    if (state.progress) Object.assign(lessonProgress, state.progress);

    function openLessonFromHome(id) {
      const lesson = lessonById(id);
      const saved = (state.progress && state.progress[id]) || {};
      state.started[id] = true;
      state.lessonId = id;

      if (state.done[id]) {
        state.screen = 0;
        state.quizIndex = 0;
        state.selected = null;
        state.revealed = false;
        state.view = "lesson";
      } else if (saved.view) {
        state.screen = saved.screen || 0;
        state.quizIndex = saved.quizIndex || 0;
        state.selected = saved.selected ?? null;
        state.revealed = !!saved.revealed;
        state.view = saved.view;
        if (state.view === "lesson" && state.screen >= lesson.screens.length) state.view = "quiz";
      } else {
        state.screen = 0;
        state.quizIndex = 0;
        state.selected = null;
        state.revealed = false;
        state.view = "lesson";
      }
      persistAll();
      render();
    }

    function back() {
      const lesson = lessonById(state.lessonId);
      if (!lesson) return goHome();
      if (state.view === "complete") {
        state.view = "quiz";
        state.quizIndex = lesson.quiz.length - 1;
        const prev = (state.answers[lesson.id] || {})[state.quizIndex];
        state.selected = prev;
        state.revealed = prev != null;
      } else if (state.view === "quiz") {
        if (state.revealed) {
          state.revealed = false;
          state.selected = null;
        } else if (state.quizIndex > 0) {
          state.quizIndex -= 1;
          const prev = (state.answers[lesson.id] || {})[state.quizIndex];
          state.selected = prev;
          state.revealed = prev != null;
        } else {
          state.view = "lesson";
          state.screen = lesson.screens.length - 1;
          state.selected = null;
          state.revealed = false;
        }
      } else if (state.view === "lesson") {
        if (state.screen > 0) {
          state.screen -= 1;
        } else {
          state.view = "home";
          state.lessonId = null;
        }
      } else {
        goHome();
        return;
      }
      persistAll();
      render();
    }

    function nextLessonScreen() {
      const lesson = lessonById(state.lessonId);
      if (state.screen < lesson.screens.length - 1) {
        state.screen += 1;
      } else {
        state.view = "quiz";
        state.quizIndex = 0;
        const prev = (state.answers[lesson.id] || {})[0];
        state.selected = prev ?? null;
        state.revealed = prev != null;
      }
      persistAll();
      render();
    }

    function chooseOption(index) {
      if (state.revealed) return;
      const lesson = lessonById(state.lessonId);
      state.selected = index;
      state.revealed = true;
      if (!state.answers[lesson.id]) state.answers[lesson.id] = {};
      state.answers[lesson.id][state.quizIndex] = index;
      persistAll();
      render();
    }

    function nextQuiz() {
      const lesson = lessonById(state.lessonId);
      if (state.quizIndex < lesson.quiz.length - 1) {
        state.quizIndex += 1;
        const prev = (state.answers[lesson.id] || {})[state.quizIndex];
        state.selected = prev ?? null;
        state.revealed = prev != null;
        state.view = "quiz";
      } else {
        state.done[lesson.id] = true;
        state.view = "complete";
        state.selected = null;
        state.revealed = false;
      }
      persistAll();
      render();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderHome() {
      const items = lessons.map((lesson, i) => {
        const status = statusFor(lesson.id);
        return `<li>
          <button class="lesson-card" type="button" data-open="${lesson.id}">
            <span class="lesson-kicker">Lesson ${i + 1} of ${lessons.length}</span>
            <span class="lesson-title">${escapeHtml(lesson.title)}</span>
            <span class="lesson-status">${status}</span>
          </button>
        </li>`;
      }).join("");

      return `
        <div class="pane">
          <p class="how">You can stop at any time and come back later. Your place is saved on this device.</p>
          <ul class="lesson-list">${items}</ul>
        </div>
      `;
    }

    function progressBlock(label, ratio) {
      const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      return `<div class="progress-wrap">
        <p class="progress-label">${escapeHtml(label)}</p>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${escapeHtml(label)}"><span style="width:${pct}%"></span></div>
      </div>`;
    }

    function backRow() {
      return `<div class="top-row"><button class="btn-back" type="button" data-back>◀ Back</button></div>`;
    }

    function renderLesson() {
      const lesson = lessonById(state.lessonId);
      const total = lesson.screens.length;
      const n = state.screen + 1;
      const text = lesson.screens[state.screen];
      const isScam = lesson.id === "spotting-scams";
      const icon = (state.screen === 0 && ICONS[lesson.id]) ? ICONS[lesson.id] : "";
      const body = `<div class="screen-text"><p>${escapeHtml(text)}</p></div>`;
      const content = isScam
        ? `<div class="caution"><p class="kicker">A careful note</p>${body}</div>`
        : body;

      return `
        <div class="chrome-top">
          ${backRow()}
          ${progressBlock("Screen " + n + " of " + total, n / total)}
        </div>
        <div class="pane">
          <h2 class="sr-only">${escapeHtml(lesson.title)}</h2>
          ${icon}
          ${content}
        </div>
        <div class="actions">
          <button class="btn-primary" type="button" data-next-screen>Next</button>
        </div>
      `;
    }

    function renderQuiz() {
      const lesson = lessonById(state.lessonId);
      const q = lesson.quiz[state.quizIndex];
      const total = lesson.quiz.length;
      const n = state.quizIndex + 1;
      const options = q.options.map((opt, i) => {
        let cls = "option";
        const pressed = state.selected === i;
        if (state.revealed) {
          if (i === q.answer) cls += " is-correct";
          else if (pressed && i !== q.answer) cls += " is-wrong";
        }
        const mark = state.revealed && i === q.answer ? " ✓" : (state.revealed && pressed && i !== q.answer ? " ✗" : "");
        return `<button class="${cls}" type="button" data-choose="${i}" aria-pressed="${pressed}" ${state.revealed ? "disabled" : ""}>${escapeHtml(opt)}${mark}</button>`;
      }).join("");

      let feedback = "";
      if (state.revealed) {
        const ok = state.selected === q.answer;
        feedback = `<div class="feedback ${ok ? "correct" : "wrong"}" role="status">
          <strong>${ok ? "That's right" : "Not quite. Here's why…"}</strong>
          <p>${escapeHtml(q.explanation)}</p>
        </div>`;
      }

      return `
        <div class="chrome-top">
          ${backRow()}
          ${progressBlock("Question " + n + " of " + total, n / total)}
          <h2 class="quiz-q">${escapeHtml(q.q)}</h2>
        </div>
        <div class="pane">
          <div class="options">${options}</div>
          ${feedback}
        </div>
        <div class="actions">
          ${state.revealed ? `<button class="btn-primary" type="button" data-next-quiz>Next</button>` : ""}
        </div>
      `;
    }

    function renderComplete() {
      const lesson = lessonById(state.lessonId);
      const i = lessonIndex(lesson.id) + 1;
      return `
        <div class="chrome-top">
          ${backRow()}
        </div>
        <div class="pane">
          <div class="complete">
            <h2>Lesson complete</h2>
            <p>You’ve finished “${escapeHtml(lesson.title)}.” That’s lesson ${i} of ${lessons.length}. You can go back home, or take this lesson again any time.</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn-primary" type="button" data-home>Back to home</button>
          <button class="btn-secondary" type="button" data-retake>Take this lesson again</button>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (state.view === "lesson") root.innerHTML = renderLesson();
      else if (state.view === "quiz") root.innerHTML = renderQuiz();
      else if (state.view === "complete") root.innerHTML = renderComplete();
      else root.innerHTML = renderHome();

      root.querySelectorAll("[data-open]").forEach((el) => {
        el.addEventListener("click", () => openLessonFromHome(el.getAttribute("data-open")));
      });
      const backBtn = root.querySelector("[data-back]");
      if (backBtn) backBtn.addEventListener("click", back);
      const nextScreen = root.querySelector("[data-next-screen]");
      if (nextScreen) nextScreen.addEventListener("click", nextLessonScreen);
      root.querySelectorAll("[data-choose]").forEach((el) => {
        el.addEventListener("click", () => chooseOption(Number(el.getAttribute("data-choose"))));
      });
      const nextQuizBtn = root.querySelector("[data-next-quiz]");
      if (nextQuizBtn) nextQuizBtn.addEventListener("click", nextQuiz);
      const homeBtn = root.querySelector("[data-home]");
      if (homeBtn) homeBtn.addEventListener("click", goHome);
      const retakeBtn = root.querySelector("[data-retake]");
      if (retakeBtn) retakeBtn.addEventListener("click", () => {
        const id = state.lessonId;
        state.done[id] = false;
        state.answers[id] = {};
        if (state.progress) delete state.progress[id];
        delete lessonProgress[id];
        state.screen = 0;
        state.quizIndex = 0;
        state.selected = null;
        state.revealed = false;
        state.view = "lesson";
        state.started[id] = true;
        persistAll();
        render();
      });

      const focusTarget = root.querySelector(".btn-primary, .quiz-q, .lesson-card, h2");
      if (focusTarget && state.view !== "home") {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) focusTarget.focus({ preventScroll: true });
      }
      if (state.revealed) {
        const chosen = root.querySelector(".option[aria-pressed=\"true\"]");
        if (chosen) chosen.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
        const fb = root.querySelector(".feedback");
        if (fb) fb.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "auto" });
      }
    }

    window.__cfg = {
      reset() {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        for (const k of Object.keys(lessonProgress)) delete lessonProgress[k];
        render();
      },
      state() { return state; }
    };

    render();
  </script>
</body>
</html>
