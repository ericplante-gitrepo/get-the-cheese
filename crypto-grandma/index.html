<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A simple guide to Bitcoin and crypto</title>
  <style>
    /* Style guide v2 "Quiet Premium". System fonts only, nothing is fetched. */
    :root {
      --page: #F6F5F2;
      --card: #FFFFFF;
      --hairline: #E3E1DC;
      --field-border: #767B85;
      --ink: #0E1116;
      --ink-2: #3D4350;
      --primary: #0E1116;
      --primary-press: #2A2F38;
      --on-primary: #FFFFFF;
      --accent: #2A1FB8;
      --accent-soft: #EEEBFF;
      --gain-text: #06552D;
      --gain-bg: #E3F4EA;
      --down-text: #3D4350;
      --down-bg: #ECEDEF;
      --error-text: #8A2A1F;
      --error-bg: #FBE9E5;
      --caution-text: #6B4300;
      --caution-bg: #FFF3D9;
      --caution-bar: #B07A1A;
      --bitcoin: #C46A12;
      --ether: #6B6F80;
      --track: #ECEDEF;
      --shadow: 0 1px 2px rgba(14, 17, 22, 0.06), 0 8px 24px rgba(14, 17, 22, 0.06);
      --radius-card: 20px;
      --radius-ctl: 14px;
      --ease: 180ms ease-out;
      --max: 40rem;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { font-size: 100%; -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--page);
      color: var(--ink);
      font-family: "Inter", "Helvetica Neue", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 1.375rem;
      font-weight: 400;
      line-height: 1.5;
    }

    @media (max-width: 30rem) {
      body { font-size: 1.25rem; }
    }

    img, svg { max-width: 100%; height: auto; display: block; }

    h1, h2, p { margin: 0; }
    p, li, h1, h2, .gain, .stat-label, .overline, .lesson-kicker { overflow-wrap: anywhere; }

    button {
      font: inherit;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
      color: inherit;
      background: none;
      border: 0;
      border-radius: var(--radius-ctl);
      padding: 0.75rem 1.25rem;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    .dollar-input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: no-preference) {
      button, .tab, .range-btn { transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease); }
      .progress-bar > span { transition: width 200ms ease-out; }
    }

    /* ---------- frame ---------- */
    .shell {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1rem 1.25rem;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 48rem) {
      .shell { padding: 1.5rem 2rem; }
      /* the 5-column holdings table needs about 620px of room (deviation from the 40rem column) */
      .shell.shell-wide { max-width: 48rem; }
      .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .app-header .subtitle { margin: 0; }
    }

    #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .app-header { flex-shrink: 0; margin: 0 0 0.5rem; }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-mark { flex: none; width: 12px; height: 12px; background: var(--accent); border-radius: 3px; }
    .app-header h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.25; color: var(--ink); }
    .subtitle { margin: 0.25rem 0 0 calc(12px + 0.75rem); color: var(--ink-2); font-size: 1.25rem; font-weight: 400; line-height: 1.3; }

    .chrome-top { flex-shrink: 0; background: var(--page); }

    .pane {
      flex: 1;
      min-height: 0;
      overflow: auto;
      /* room inside the scroller so card shadows are not clipped */
      margin: 0 -0.75rem;
      padding: 0.25rem 0.75rem 1rem;
    }

    main { display: flex; flex-direction: column; }

    /* ---------- type ---------- */
    .overline {
      margin: 0 0 0.25rem;
      color: var(--ink-2);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .stat-label, .field-label { color: var(--ink-2); font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
    .field-label { display: block; margin: 0 0 0.5rem; color: var(--ink); }
    .stat-label { margin: 0 0 0.25rem; }

    h2.wallet-h, .section-h {
      margin: 0 0 1rem;
      font-size: 1.5rem;
      font-weight: 650;
      line-height: 1.25;
      color: var(--ink);
    }
    @media (min-width: 30.0625rem) { h2.wallet-h, .section-h { font-size: 1.625rem; } }
    .pane > h2.wallet-h:not(:first-child) { margin-top: 1.5rem; }

    .money { font-weight: 700; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .money-lg { font-size: 2.5rem; line-height: 1.1; letter-spacing: -0.02em; }
    @media (min-width: 30.0625rem) { .money-lg { font-size: 3rem; } }
    .money-md { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; }
    @media (max-width: 22rem) {
      .money-lg { font-size: clamp(1.25rem, 9.5vw, 2.5rem); }
      .money-md { font-size: 1.375rem; }
    }

    .updated, .price-line, .stat-note { margin: 0.5rem 0 0; color: var(--ink-2); font-size: 1.25rem; font-weight: 400; }
    .stat-note { font-weight: 600; margin: 0; }
    .price-line { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ---------- cards ---------- */
    .card, .hold-card, .lesson-card, .wallet-entry, .history, .caution, .chart-empty {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }
    .card, .hold-card { padding: 1.5rem; margin: 0 0 1rem; }
    @media (max-width: 20rem) { .card, .hold-card { padding: 0.75rem; } }
    .card > :last-child, .hold-card > :last-child { margin-bottom: 0; }
    .card + .card, .hold-card + .hold-card { margin-top: 0; }
    .card-split { border-top: 1px solid var(--hairline); margin: 1.5rem 0 0; padding: 1.5rem 0 0; }

    .hold-card p { margin: 0 0 0.5rem; }
    .hold-card p:last-child { margin-bottom: 0; }
    .hold-card .coin-line { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; margin: 0 0 0.5rem; }

    .dot { flex: none; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-2); }
    .dot-btc { background: var(--bitcoin); }
    .dot-eth { background: var(--ether); }
    .dot-cash { background: var(--accent); }

    /* ---------- home ---------- */
    .how { margin: 0 0 1.5rem; color: var(--ink-2); max-width: 34em; }

    .lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1rem; }

    .lesson-card, .wallet-entry {
      display: block;
      width: 100%;
      text-align: left;
      padding: 1.5rem;
      min-height: 4rem;
      color: var(--ink);
      font-weight: 400;
    }
    .lesson-card:hover { border-color: var(--field-border); }

    .lesson-kicker {
      display: block;
      margin: 0 0 0.25rem;
      color: var(--ink-2);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .lesson-title { display: block; font-size: 1.375rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
    .lesson-status { display: block; margin-top: 0.5rem; color: var(--ink-2); font-size: 1.25rem; font-weight: 600; }

    /* ---------- lesson list (style guide v2, "Lesson list") ---------- */
    .progress-card { padding: 1.25rem; margin: 0 0 1.5rem; }
    .progress-card .progress-label { margin: 0 0 0.75rem; color: var(--ink); font-size: 1.25rem; font-weight: 600; }
    .group { margin: 0 0 1.5rem; }
    .group-label { margin: 0 0 0.75rem; color: var(--ink-2); font-size: 1.25rem; font-weight: 600; letter-spacing: 0.06em; line-height: 1.3; text-transform: uppercase; }
    .lesson-card {
      display: grid;
      grid-template-columns: 2.5rem minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 1rem;
      min-height: 4.5rem;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      box-shadow: none;
      cursor: pointer;
    }
    .lesson-card.is-next { border: 2px solid var(--accent); padding: calc(1rem - 1px) calc(1.25rem - 1px); }
    .lesson-card .num {
      display: flex; align-items: center; justify-content: center;
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      font-size: 1.25rem; font-weight: 700; line-height: 1;
    }
    .lesson-card.is-done .num { background: var(--gain-bg); color: var(--gain-text); }
    .lesson-card .lesson-title { font-size: 1.25rem; font-weight: 600; line-height: 1.3; letter-spacing: 0; color: var(--ink); }
    .lesson-card .lesson-status { margin-top: 0.125rem; font-size: 1.25rem; font-weight: 400; line-height: 1.3; }
    .lesson-card.is-done .lesson-status { color: var(--gain-text); font-weight: 600; }
    .lesson-card .chev { color: var(--ink-2); font-size: 1.25rem; line-height: 1; }
    .lesson-card .chip {
      display: inline-block; margin-top: 0.5rem; padding: 0.125rem 0.75rem; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 1.25rem; font-weight: 700; line-height: 1.4;
    }
    @media (min-width: 30rem) { .lesson-card .lesson-title { font-size: 1.375rem; line-height: 1.25; } }
    @media (max-width: 20rem) {
      .lesson-card { column-gap: 0.5rem; padding: 0.75rem; }
      .lesson-card.is-next { padding: calc(0.75rem - 1px); }
    }

    .wallet-entry { margin: 0 0 1.5rem; background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .wallet-entry:hover { background: var(--primary-press); }
    .wallet-entry .lesson-kicker { color: #D9DCE3; }
    .wallet-entry .lesson-title { color: var(--on-primary); }

    /* ---------- lessons ---------- */
    .progress-wrap { margin: 0 0 1.25rem; }
    .progress-label { margin: 0 0 0.5rem; color: var(--ink-2); font-size: 1.25rem; font-weight: 600; }
    .progress-bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
    .progress-bar > span { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 999px; }

    .top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.5rem; }

    .btn-back {
      min-height: 3.5rem;
      min-width: 3.5rem;
      padding: 0.5rem 1.25rem;
      background: var(--card);
      color: var(--accent);
      border: 2px solid var(--field-border);
    }

    .screen-text { max-width: 34em; margin: 0 0 1rem; }
    .card > .screen-text { margin: 0; }
    .screen-text p { margin: 0 0 0.8rem; }
    .screen-text p:last-child { margin-bottom: 0; }
    .card.screen-text { max-width: none; padding: 1.5rem; }
    .card.screen-text p { max-width: 34em; }

    .illustration { width: 7.5rem; margin: 0 0 1.25rem; }
    .illustration svg { width: 100%; height: auto; }

    .caution {
      background: var(--caution-bg);
      color: var(--caution-text);
      border: 1px solid var(--hairline);
      border-left: 4px solid var(--caution-bar);
      padding: 1.5rem;
      box-shadow: none;
    }
    .caution .kicker { margin: 0 0 0.5rem; font-weight: 700; font-size: 1.25rem; }
    .caution .screen-text { margin: 0; color: var(--caution-text); max-width: 34em; }

    .quiz-q { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; max-width: 34em; }
    @media (min-width: 30.0625rem) { .quiz-q { font-size: 1.625rem; } }

    .options, .coin-pick { display: flex; flex-direction: column; gap: 0.75rem; margin: 0 0 1.25rem; }

    .option {
      width: 100%;
      min-height: 4rem;
      text-align: left;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--field-border);
      border-radius: var(--radius-ctl);
      padding: 1rem 1.25rem;
    }
    .option[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .option.is-correct { background: var(--gain-bg); color: var(--gain-text); border-color: var(--gain-text); }
    .option.is-wrong { background: var(--error-bg); color: var(--error-text); border-color: var(--error-text); }
    .option:disabled:not(.is-correct):not(.is-wrong) { background: var(--card); color: var(--ink-2); border: 2px solid var(--hairline); }
    .option:disabled { cursor: default; border-style: solid; }

    .feedback { border-radius: var(--radius-ctl); padding: 1rem 1.25rem; margin: 0 0 1.25rem; max-width: 34em; }
    .feedback.correct { background: var(--gain-bg); color: var(--gain-text); }
    .feedback.wrong { background: var(--error-bg); color: var(--error-text); }
    .feedback strong { display: block; margin-bottom: 0.25rem; font-size: 1.375rem; font-weight: 700; }
    .feedback p { margin: 0; }

    .complete { padding: 1.5rem; }
    .complete .badge { display: inline-flex; align-items: center; justify-content: center; width: 3.5rem; height: 3.5rem; margin: 0 0 1rem; border-radius: 50%; background: var(--gain-bg); color: var(--gain-text); font-size: 1.75rem; font-weight: 700; }
    .complete h2 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
    @media (min-width: 30.0625rem) { .complete h2 { font-size: 2rem; } }
    .complete p { max-width: 34em; }

    /* ---------- actions and buttons ---------- */
    .actions { flex-shrink: 0; padding-top: 1rem; display: flex; flex-direction: column; gap: 1rem; background: var(--page); }
    @media (max-height: 56rem) { .actions { padding-top: 0.5rem; gap: 0.5rem; } }
    @media (min-width: 48rem) { .actions { align-items: stretch; } }

    .btn-primary {
      width: 100%;
      min-height: 4rem;
      background: var(--primary);
      color: var(--on-primary);
      border: 0;
      border-radius: var(--radius-ctl);
      font-size: 1.25rem;
    }
    @media (min-width: 30.0625rem) { .btn-primary, .btn-secondary { font-size: 1.375rem; } }
    .btn-primary:active { background: var(--primary-press); }

    .btn-secondary {
      width: 100%;
      min-height: 3.5rem;
      background: var(--card);
      color: var(--accent);
      border: 2px solid var(--field-border);
      border-radius: var(--radius-ctl);
    }
    .btn-secondary:active { background: var(--accent-soft); }

    .pair { display: flex; flex-direction: column; gap: 1rem; }
    .actions-row { display: flex; flex-direction: row; gap: 0.75rem; }
    .actions-row .btn-secondary, .actions-row .btn-primary { flex: 1; width: auto; padding-left: 0.5rem; padding-right: 0.5rem; }

    /* disabled buttons keep full opacity: ink-2 label on grey with a dashed edge */
    button:disabled, button[disabled] {
      cursor: default;
      opacity: 1;
      background: var(--down-bg);
      color: var(--ink-2);
      border: 2px dashed var(--field-border);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- wallet ---------- */
    .pretend {
      display: inline-block;
      margin: 0;
      padding: 0.25rem 0.9rem;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      white-space: normal;
      max-width: 100%;
    }

    .stat-block { margin: 0 0 1rem; }
    .stat-block:last-child { margin-bottom: 0; }

    .gain {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    .gain.up { background: var(--gain-bg); color: var(--gain-text); }
    .gain.down { background: var(--down-bg); color: var(--down-text); }

    .history { list-style: none; margin: 0 0 1rem; padding: 0.5rem 1.5rem; }
    @media (max-width: 20rem) { .history { padding: 0.5rem 1rem; } }
    .history li { margin: 0; padding: 1rem 0; border-bottom: 1px solid var(--hairline); }
    .history li:last-child { border-bottom: 0; }
    .history li.undone { color: var(--ink-2); }
    .history li.undone .hist-text { text-decoration: line-through; }
    .history .tag { display: inline-block; margin-left: 0.5rem; font-weight: 700; color: var(--ink-2); }

    .presets { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0 1rem; }
    .presets button, .range-btn {
      min-height: 3.5rem;
      min-width: 4.5rem;
      padding: 0.5rem 1rem;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--field-border);
      border-radius: 999px;
    }
    .presets button[aria-pressed="true"], .range-btn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .presets button:disabled { border-style: dashed; }

    .dollar-input {
      width: 100%;
      min-height: 4rem;
      font: inherit;
      font-weight: 700;
      font-size: 1.75rem;
      font-variant-numeric: tabular-nums;
      padding: 0.5rem 1rem;
      border: 2px solid var(--field-border);
      border-radius: var(--radius-ctl);
      background: var(--card);
      color: var(--ink);
      max-width: 100%;
    }
    .dollar-input:disabled { background: var(--down-bg); color: var(--ink-2); border-style: dashed; }

    .fee-line { margin: 0.5rem 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }

    .notice { border-radius: var(--radius-ctl); padding: 1rem 1.25rem; margin: 0 0 1rem; max-width: none; }
    .notice.wait { background: var(--caution-bg); color: var(--caution-text); border-left: 4px solid var(--caution-bar); border-radius: var(--radius-ctl); }
    .notice.err { background: var(--error-bg); color: var(--error-text); }
    .actions .notice { margin: 0; }

    /* ---------- tabs: two-way switch ---------- */
    .wallet-top { margin: 0 0 0.75rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin: 0 0 0.75rem; background: var(--track); border-radius: 18px; }
    .tab {
      flex: 1 1 8rem;
      min-width: 0;
      padding: 0.5rem 0.25rem;
      min-height: 3.5rem;
      font: inherit;
      font-weight: 500;
      border: 2px solid transparent;
      border-radius: var(--radius-ctl);
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 700; border-color: var(--ink); box-shadow: 0 1px 2px rgba(14, 17, 22, 0.12), 0 2px 8px rgba(14, 17, 22, 0.08); }
    .tab-mark { display: none; }
    @media (max-width: 17rem) {
      /* 200% zoom on a phone: stack things and let the whole page scroll down instead of pinning bars */
      .shell { height: auto; min-height: 100vh; overflow: visible; }
      #app, .pane { overflow: visible; }
      .actions-row { flex-direction: column; }
      .tabs { flex-direction: column; }
      .pretend { white-space: normal; text-align: center; }
    }
    .tab:focus-visible, .range-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- Summary ---------- */
    .summary .gain { margin-top: 0; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.5rem; margin: 1.5rem 0 0; padding: 1.5rem 0 0; border-top: 1px solid var(--hairline); }
    @media (max-width: 30rem) { .stat-grid { grid-template-columns: 1fr; } }
    .summary .stat-block > p { margin: 0 0 0.25rem; }
    .summary .stat-block > p.stat-label { margin-bottom: 0.5rem; }

    .hold-table { width: 100%; border-collapse: collapse; margin: 0; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .hold-table th, .hold-table td { text-align: left; padding: 0.5rem 0.375rem; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
    .hold-table th:first-child, .hold-table td:first-child { padding-left: 0; }
    .hold-table th:last-child, .hold-table td:last-child { padding-right: 0; }
    .hold-table thead th { color: var(--ink-2); font-size: 1.25rem; font-weight: 600; background: var(--card); }
    .hold-table tbody tr { height: 4.5rem; }
    .hold-table tbody tr:last-child th, .hold-table tbody tr:last-child td { border-bottom: 0; }
    .hold-table tbody th { font-weight: 600; }
    .hold-table .coin-cell { display: flex; align-items: center; gap: 0.5rem; }
    .hold-table th:nth-child(n+2), .hold-table td { text-align: right; }
    .hold-table td:nth-child(-n+4) { white-space: nowrap; }
    @media (max-width: 20rem) { .card .hold-table tbody tr { padding: 0.75rem; } .hold-table .dot { display: none; } }
    .hold-table .gain { padding: 4px 12px; font-size: 1.25rem; line-height: 1.3; white-space: nowrap; text-align: right; border-radius: 16px; }
    /* the 5-column table with one-line gain chips needs about 790px; wide Summary column at 58rem+, stacked cards below */
    @media (min-width: 58rem) { .shell.shell-wide { max-width: 58rem; } }
    @media (max-width: 57.99rem) {

      "what-is-bitcoin": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle cx="60" cy="60" r="42" fill="#FFFFFF" stroke="#0E1116" stroke-width="3"/><circle cx="60" cy="60" r="30" fill="#F6F5F2" stroke="#0E1116" stroke-width="3"/><text x="60" y="72" text-anchor="middle" font-size="36" font-weight="700" fill="#C46A12" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">B</text></svg>`,
      "spotting-scams": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path d="M60 18l38 14v28c0 24-16 40-38 48C38 100 22 84 22 60V32z" fill="#FFF3D9" stroke="#0E1116" stroke-width="3" stroke-linejoin="round"/><path d="M42 62l12 12 24-26" fill="none" stroke="#06552D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      "buying-and-selling": `<svg class="illustration" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="18" y="38" width="38" height="28" rx="6" fill="#FFFFFF" stroke="#0E1116" stroke-width="3"/><rect x="64" y="54" width="38" height="28" rx="6" fill="#F6F5F2" stroke="#0E1116" stroke-width="3"/><path d="M44 28h0c10 0 18 8 18 16" fill="none" stroke="#2A1FB8" stroke-width="3" stroke-linecap="round"/><path d="M56 22l6 10-12 0z" fill="#2A1FB8" stroke="#0E1116" stroke-width="1.5"/><path d="M76 92h0c-10 0-18-8-18-16" fill="none" stroke="#2A1FB8" stroke-width="3" stroke-linecap="round"/><path d="M64 98l-6-10 12 0z" fill="#2A1FB8" stroke="#0E1116" stroke-width="1.5"/><text x="37" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#0E1116" font-family="Arial,sans-serif">$</text><circle cx="83" cy="68" r="8" fill="none" stroke="#C46A12" stroke-width="3"/></svg>`
    };

    function defaultState() {
      return {
        view: "home",
        lessonId: null,
        screen: 0,
        quizIndex: 0,
        selected: null,
        revealed: false,
        started: {},
        done: {},
        answers: {},
        progress: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const data = JSON.parse(raw);
        const loaded = { ...defaultState(), ...data };
        loaded.started = loaded.started || {};
        loaded.done = loaded.done || {};
        loaded.answers = loaded.answers || {};
        loaded.progress = loaded.progress || {};
        return loaded;
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      const toSave = {
        view: state.view,
        lessonId: state.lessonId,
        screen: state.screen,
        quizIndex: state.quizIndex,
        selected: state.selected,
        revealed: state.revealed,
        started: state.started,
        done: state.done,
        answers: state.answers,
        progress: state.progress || {},
        wallet: snapshotWallet()
      };
      toSave.wallet.history = wallet.history;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    let state = loadState();
    // A saved lesson view for a lesson that no longer exists falls back to home.
    if (["lesson", "quiz", "complete"].includes(state.view) && !lessons.some((l) => l.id === state.lessonId)) {
      state.view = "home"; state.lessonId = null; state.selected = null; state.revealed = false;
    }

    // Wallet helpers are defined below; load saved wallet after they exist.
    let _pendingWallet = state.wallet;
    delete state.wallet;


    function lessonById(id) {
      return lessons.find((l) => l.id === id);
    }

    function lessonIndex(id) {
      return lessons.findIndex((l) => l.id === id);
    }

    function goHome() {
      persistAll();
      stopPolling();
      state.view = "home";
      state.lessonId = null;
      state.selected = null;
      state.revealed = false;
      saveState();
      render();
    }

    // Keep per-lesson progress so switching lessons doesn't lose her place.
    const lessonProgress = {};

    function storeProgress() {
      if (!state.lessonId) return;
      if (!state.answers[state.lessonId]) state.answers[state.lessonId] = {};
      lessonProgress[state.lessonId] = {
        screen: state.screen,
        quizIndex: state.quizIndex,
        selected: state.selected,
        revealed: state.revealed,
        view: state.view
      };
    }

    function persistAll() {
      storeProgress();
      state.progress = Object.assign(state.progress || {}, lessonProgress);
      saveState();
    }

    // Restore per-lesson place after a reload.
    if (state.progress) Object.assign(lessonProgress, state.progress);

    function openLessonFromHome(id) {
      const lesson = lessonById(id);
      const saved = (state.progress && state.progress[id]) || {};
      state.started[id] = true;
      state.lessonId = id;

      if (state.done[id]) {
        state.screen = 0;
        state.quizIndex = 0;
        state.selected = null;
        state.revealed = false;
        state.view = "lesson";
      } else if (saved.view) {
        state.screen = saved.screen || 0;
        state.quizIndex = saved.quizIndex || 0;
        state.selected = saved.selected ?? null;
        state.revealed = !!saved.revealed;
        state.view = saved.view;
        if (state.view === "lesson" && state.screen >= lesson.screens.length) state.view = "quiz";
      } else {
        state.screen = 0;
        state.quizIndex = 0;
        state.selected = null;
        state.revealed = false;
        state.view = "lesson";
      }
      persistAll();
      render();
    }

    function back() {
      if (isWalletView(state.view)) {
        backWallet();
        return;
      }
      const lesson = lessonById(state.lessonId);
      if (!lesson) return goHome();
      if (state.view === "complete") {
        state.view = "quiz";
        state.quizIndex = lesson.quiz.length - 1;
        const prev = (state.answers[lesson.id] || {})[state.quizIndex];
        state.selected = prev;
        state.revealed = prev != null;
      } else if (state.view === "quiz") {
        if (state.revealed) {
          state.revealed = false;
          state.selected = null;
        } else if (state.quizIndex > 0) {
          state.quizIndex -= 1;
          const prev = (state.answers[lesson.id] || {})[state.quizIndex];
          state.selected = prev;
          state.revealed = prev != null;
        } else {
          state.view = "lesson";
          state.screen = lesson.screens.length - 1;
          state.selected = null;
          state.revealed = false;
        }
      } else if (state.view === "lesson") {
        if (state.screen > 0) {
          state.screen -= 1;
        } else {
          state.view = "home";
          state.lessonId = null;
        }
      } else {
        goHome();
        return;
      }
      persistAll();
      render();
    }

    function nextLessonScreen() {
      const lesson = lessonById(state.lessonId);
      if (state.screen < lesson.screens.length - 1) {
        state.screen += 1;
      } else {
        state.view = "quiz";
        state.quizIndex = 0;
        const prev = (state.answers[lesson.id] || {})[0];
        state.selected = prev ?? null;
        state.revealed = prev != null;
      }
      persistAll();
      render();
    }

    function chooseOption(index) {
      if (state.revealed) return;
      const lesson = lessonById(state.lessonId);
      state.selected = index;
      state.revealed = true;
      if (!state.answers[lesson.id]) state.answers[lesson.id] = {};
      state.answers[lesson.id][state.quizIndex] = index;
      persistAll();
      render();
    }

    function nextQuiz() {
      const lesson = lessonById(state.lessonId);
      if (state.quizIndex < lesson.quiz.length - 1) {
        state.quizIndex += 1;
        const prev = (state.answers[lesson.id] || {})[state.quizIndex];
        state.selected = prev ?? null;
        state.revealed = prev != null;
        state.view = "quiz";
      } else {
        state.done[lesson.id] = true;
        state.view = "complete";
        state.selected = null;
        state.revealed = false;
      }
      persistAll();
      render();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const START_CASH_CENTS = 1000000;
    const FEE_BPS = 50; // 0.5%
    const MIN_TRADE_CENTS = 100;
    const STALE_MS = 120000;
    const POLL_MS = 30000;
    const SANITY = 0.20;
    const COINBASE_BTC = "https://api.coinbase.com/v2/prices/BTC-USD/spot";
    const COINBASE_ETH = "https://api.coinbase.com/v2/prices/ETH-USD/spot";
    const COINGECKO = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd";
    const COIN_NAME = { btc: "Bitcoin", eth: "Ethereum" };

    function defaultWallet() {
      return {
        cashCents: START_CASH_CENTS,
        coins: {
          btc: { units: 0, costCents: 0 },
          eth: { units: 0, costCents: 0 }
        },
        history: []
      };
    }

    function defaultPrices() {
      return { btc: null, eth: null, error: null, pinned: false };
    }

    let wallet = defaultWallet();
    let prices = defaultPrices();
    let feedControl = { coinbaseDown: false, geckoDown: false };
    let pollTimer = null;
    let tradeDraft = null;
    let tradeError = "";

    function normalizeWallet(raw) {
      const w = defaultWallet();
      if (!raw || typeof raw !== "object") return w;
      if (Number.isInteger(raw.cashCents) && raw.cashCents >= 0) w.cashCents = raw.cashCents;
      for (const id of ["btc", "eth"]) {
        const c = raw.coins && raw.coins[id];
        if (c) {
          w.coins[id].units = Number.isInteger(c.units) && c.units >= 0 ? c.units : 0;
          w.coins[id].costCents = Number.isInteger(c.costCents) && c.costCents >= 0 ? c.costCents : 0;
        }
      }
      if (Array.isArray(raw.history)) w.history = raw.history;
      return w;
    }

    function holdingValueCents(id, price) {
      if (!price || wallet.coins[id].units <= 0) return 0;
      return Math.floor(wallet.coins[id].units * price / 1e6);
    }

    function feeOn(amountCents) {
      return Math.max(1, Math.round(amountCents * 0.005));
    }

    function buyUnits(netCents, price) {
      if (!price || price <= 0 || netCents <= 0) return 0;
      return Math.floor(netCents * 1e6 / price);
    }

    function sellProceedsCents(units, price) {
      if (!price || price <= 0 || units <= 0) return 0;
      return Math.floor(units * price / 1e6);
    }

    function snapshotWallet() {
      return {
        cashCents: wallet.cashCents,
        coins: {
          btc: { units: wallet.coins.btc.units, costCents: wallet.coins.btc.costCents },
          eth: { units: wallet.coins.eth.units, costCents: wallet.coins.eth.costCents }
        }
      };
    }

    function restoreSnapshot(s) {
      wallet.cashCents = s.cashCents;
      wallet.coins.btc = { units: s.coins.btc.units, costCents: s.coins.btc.costCents };
      wallet.coins.eth = { units: s.coins.eth.units, costCents: s.coins.eth.costCents };
    }

    function formatDollars(cents, { sign = false } = {}) {
      const n = Math.abs(cents);
      const dollars = (n / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const body = "$" + dollars;
      if (!sign) return cents < 0 ? "−" + body : body;
      if (cents > 0) return "+" + body;
      if (cents < 0) return "−" + body;
      return body;
    }

    function formatCoins(units) {
      const s = (units / 1e8).toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
      const [w, frac = ""] = s.split(".");
      if (!frac) return w + ".00";
      return frac.length >= 2 ? s : w + "." + frac.padEnd(2, "0");
    }

    function formatPrice(price) {
      if (price == null || !Number.isFinite(price)) return "—";
      // Every dollar amount shown to the user has exactly 2 decimals (slice 2b). Math stays in cents.
      return "$" + (Math.round(price * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseDollarInput(text) {
      if (text == null) return null;
      const cleaned = String(text).replace(/[$,\s]/g, "");
      if (!cleaned || !/^\d+(\.\d{1,2})?$/.test(cleaned)) return null;
      const cents = Math.round(Number(cleaned) * 100);
      if (!Number.isFinite(cents) || cents < 0) return null;
      return cents;
    }

    function priceAgeMs(id) {
      const p = prices[id];
      if (!p || p.fetchedAt == null) return Infinity;
      return Date.now() - p.fetchedAt;
    }

    function isStale(id) {
      return priceAgeMs(id) > STALE_MS;
    }

    function lastPrice(id) {
      const p = prices[id];
      if (!p || p.value == null) return null;
      return p.value;
    }

    function livePrice(id) {
      if (prices.error === "both") return null;
      if (isStale(id)) return null;
      return lastPrice(id);
    }

    function anyStaleOrMissing() {
      return livePrice("btc") == null || livePrice("eth") == null;
    }

    function bothMissing() {
      return (!prices.btc || prices.btc.value == null) && (!prices.eth || prices.eth.value == null);
    }

    function updatedLabel() {
      const times = ["btc", "eth"].map((id) => prices[id] && prices[id].fetchedAt).filter(Boolean);
      if (!times.length) return "";
      const age = Date.now() - Math.min.apply(null, times);
      const secs = Math.floor(age / 1000);
      if (secs < 15) return "Updated just now";
      if (secs < 60) return "Updated " + secs + " seconds ago";
      const mins = Math.floor(secs / 60);
      if (mins === 1) return "Updated 1 minute ago";
      return "Updated " + mins + " minutes ago";
    }

    function lastUpdatedClock() {
      const times = ["btc", "eth"].map((id) => prices[id] && prices[id].fetchedAt).filter(Boolean);
      if (!times.length) return "";
      return new Date(Math.min.apply(null, times)).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    function noticeMarkup(notice) {
      if (!notice) return "";
      let text = notice.text;
      const hasAny = (prices.btc && prices.btc.value != null) || (prices.eth && prices.eth.value != null);
      const clock = lastUpdatedClock();
      if (notice.kind === "wait" && hasAny && clock) text = "Prices may be out of date. Last updated " + clock + ".";
      return `<div class="notice ${notice.kind}" role="status">${escapeHtml(text)}</div>`;
    }

    function walletNotice() {
      if (prices.error === "both" || (bothMissing() && !prices.btc && !prices.eth) || (prices.error === "both")) {
        // fall through
      }
      const hasAny = (prices.btc && prices.btc.value != null) || (prices.eth && prices.eth.value != null);
      if (prices.error === "both" || (!hasAny && prices.error)) {
        return { kind: "err", text: "We can't get prices right now. Your practice money is safe. Try again later." };
      }
      if (anyStaleOrMissing() && hasAny) {
        return { kind: "wait", text: "Prices are updating, please wait a moment." };
      }
      if (!hasAny) {
        return { kind: "wait", text: "Prices are updating, please wait a moment." };
      }
      return null;
    }

    function totalWorthCents() {
      let t = wallet.cashCents;
      const btc = lastPrice("btc");
      const eth = lastPrice("eth");
      if (btc) t += holdingValueCents("btc", btc);
      if (eth) t += holdingValueCents("eth", eth);
      return t;
    }

    function canTrade() {
      return livePrice("btc") != null && livePrice("eth") != null;
    }

    function applyBuy(coin, amountCents, price) {
      if (amountCents < MIN_TRADE_CENTS) {
        return { ok: false, error: "The smallest trade is $1.00." };
      }
      if (amountCents > wallet.cashCents) {
        return { ok: false, error: "You only have " + formatDollars(wallet.cashCents) + " in cash." };
      }
      if (!price || price <= 0) {
        return { ok: false, error: "Prices are updating, please wait a moment." };
      }
      const feeCents = feeOn(amountCents);
      const netCents = amountCents - feeCents;
      const units = buyUnits(netCents, price);
      if (units <= 0) {
        return { ok: false, error: "The smallest trade is $1.00." };
      }
      const before = snapshotWallet();
      wallet.cashCents -= amountCents;
      if (wallet.cashCents < 0) {
        restoreSnapshot(before);
        return { ok: false, error: "You only have " + formatDollars(before.cashCents) + " in cash." };
      }
      wallet.coins[coin].units += units;
      wallet.coins[coin].costCents += amountCents;
      const text = "You bought " + formatDollars(amountCents) + " of " + COIN_NAME[coin] + " at " + formatPrice(price) + ". Fee " + formatDollars(feeCents) + ".";
      wallet.history.unshift({
        id: Date.now() + "-" + Math.random().toString(16).slice(2),
        type: "buy",
        coin,
        amountCents,
        feeCents,
        units,
        price,
        text,
        undone: false,
        snapshot: before
      });
      return { ok: true, feeCents, units, text };
    }

    function applySell(coin, amountCents, price, sellAll) {
      const held = wallet.coins[coin].units;
      if (held <= 0) {
        return { ok: false, error: "You don’t have any " + COIN_NAME[coin] + " to sell." };
      }
      if (!price || price <= 0) {
        return { ok: false, error: "Prices are updating, please wait a moment." };
      }
      const valueCents = holdingValueCents(coin, price);
      let units;
      if (sellAll) {
        units = held;
      } else {
        if (amountCents < MIN_TRADE_CENTS) {
          return { ok: false, error: "The smallest trade is $1.00." };
        }
        if (amountCents > valueCents) {
          return { ok: false, error: "Sell all (" + formatDollars(valueCents) + ")", offerAll: valueCents };
        }
        units = buyUnits(amountCents, price); // floor(amount / price) in 8 decimals
        if (units > held) units = held;
        if (units <= 0) {
          return { ok: false, error: "The smallest trade is $1.00." };
        }
      }
      const proceedsCents = sellProceedsCents(units, price);
      const feeCents = feeOn(proceedsCents);
      const netCents = proceedsCents - feeCents;
      if (netCents < 0) {
        return { ok: false, error: "The smallest trade is $1.00." };
      }
      const before = snapshotWallet();
      const share = units / held;
      const costRemoved = Math.round(wallet.coins[coin].costCents * share);
      wallet.coins[coin].units -= units;
      wallet.coins[coin].costCents -= costRemoved;
      if (wallet.coins[coin].units === 0) wallet.coins[coin].costCents = 0;
      wallet.cashCents += netCents;
      const realizedCents = netCents - costRemoved;
      const all = sellAll || units === before.coins[coin].units;
      const text = all
        ? "You sold all your " + COIN_NAME[coin] + " for " + formatDollars(proceedsCents) + " at " + formatPrice(price) + ". Fee " + formatDollars(feeCents) + "."
        : "You sold " + formatDollars(amountCents) + " of " + COIN_NAME[coin] + " at " + formatPrice(price) + ". Fee " + formatDollars(feeCents) + ".";
      wallet.history.unshift({
        id: Date.now() + "-" + Math.random().toString(16).slice(2),
        type: "sell",
        coin,
        amountCents: sellAll ? proceedsCents : amountCents,
        feeCents,
        units,
        price,
        proceedsCents,
        realizedCents,
        text,
        undone: false,
        snapshot: before
      });
      return { ok: true, feeCents, units, proceedsCents, realizedCents, text };
    }

    function applyUndo() {
      const last = wallet.history.find((h) => !h.undone);
      if (!last) return { ok: false, error: "There is nothing to undo." };
      restoreSnapshot(last.snapshot);
      last.undone = true;
      return { ok: true };
    }

    function applyStartOver() {
      wallet = defaultWallet();
      tradeDraft = null;
      tradeError = "";
      return { ok: true };
    }

    function lastUndoable() {
      return wallet.history.some((h) => !h.undone);
    }

    function persistWallet() {
      persistAll();
    }

    async function fetchCoinbase() {
      if (feedControl.coinbaseDown) throw new Error("coinbase down");
      const [btcR, ethR] = await Promise.all([
        fetch(COINBASE_BTC, { cache: "no-store" }),
        fetch(COINBASE_ETH, { cache: "no-store" })
      ]);
      if (!btcR.ok || !ethR.ok) throw new Error("coinbase http");
      const btcJ = await btcR.json();
      const ethJ = await ethR.json();
      const btc = parseFloat(btcJ && btcJ.data && btcJ.data.amount);
      const eth = parseFloat(ethJ && ethJ.data && ethJ.data.amount);
      if (!Number.isFinite(btc) || !Number.isFinite(eth) || btc <= 0 || eth <= 0) throw new Error("coinbase parse");
      return { btc, eth, source: "coinbase" };
    }

    async function fetchGecko() {
      if (feedControl.geckoDown) throw new Error("gecko down");
      const r = await fetch(COINGECKO, { cache: "no-store" });
      if (!r.ok) throw new Error("gecko http");
      const j = await r.json();
      const btc = parseFloat(j && j.bitcoin && j.bitcoin.usd);
      const eth = parseFloat(j && j.ethereum && j.ethereum.usd);
      if (!Number.isFinite(btc) || !Number.isFinite(eth) || btc <= 0 || eth <= 0) throw new Error("gecko parse");
      return { btc, eth, source: "coingecko" };
    }

    function tooWild(next, last) {
      if (last == null || last <= 0 || next == null) return false;
      return Math.abs(next - last) / last > SANITY;
    }

    function acceptPrices(pack, at) {
      const now = at != null ? at : Date.now();
      prices.btc = { value: pack.btc, fetchedAt: now, source: pack.source };
      prices.eth = { value: pack.eth, fetchedAt: now, source: pack.source };
      prices.error = null;
    }

    async function refreshPrices() {
      if (prices.pinned) return;
      const lastB = prices.btc && prices.btc.value;
      const lastE = prices.eth && prices.eth.value;
      try {
        let pack;
        try {
          pack = await fetchCoinbase();
        } catch (e) {
          pack = await fetchGecko();
        }
        if (prices.pinned) return;
        if (tooWild(pack.btc, lastB) || tooWild(pack.eth, lastE)) {
          const backup = pack.source === "coinbase" ? await fetchGecko() : await fetchCoinbase();
          if (prices.pinned) return;
          if (!tooWild(backup.btc, lastB) && !tooWild(backup.eth, lastE)) pack = backup;
          else if (tooWild(pack.btc, lastB) || tooWild(pack.eth, lastE)) {
            // Keep last good prices rather than accept a wild jump from both feeds.
            if (lastB && lastE) return;
            pack = backup;
          }
        }
        if (prices.pinned) return;
        acceptPrices(pack);
        onPricesRefreshed();
      } catch (e) {
        try {
          const pack = await fetchGecko();
          if (prices.pinned) return;
          acceptPrices(pack);
          onPricesRefreshed();
        } catch (e2) {
          if (prices.pinned) return;
          prices.error = "both";
        }
      }
      if (isWalletView(state.view) && !prices.pinned) render();
    }

    function isWalletView(view) {
      return view === "wallet" || view === "summary" || view === "trade" || view === "confirm" || view === "startover";
    }

    function startPolling() {
      stopPolling();
      if (prices.pinned) return;
      refreshPrices();
      pollTimer = setInterval(() => {
        if (document.hidden) return;
        if (!isWalletView(state.view)) return;
        refreshPrices();
      }, POLL_MS);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (isWalletView(state.view) && !prices.pinned) refreshPrices();
    });

    function openWallet() {
      persistAll();
      state.view = "wallet";
      state.lessonId = null;
      tradeError = "";
      tradeDraft = null;
      persistAll();
      startPolling();
      render();
    }

    function backWallet() {
      if (state.view === "confirm" && tradeDraft) {
        state.view = "trade";
        persistAll();
        render();
        return;
      }
      if (state.view === "trade" || state.view === "startover" || state.view === "confirm") {
        state.view = "wallet";
        tradeDraft = null;
        tradeError = "";
        persistAll();
        render();
        return;
      }
      stopPolling();
      goHome();
    }

    function openTrade(side) {
      if (!canTrade() && side) {
        // still allow opening to see the message? Spec: disable Buy and Sell when stale.
        return;
      }
      tradeDraft = {
        side,
        coin: "btc",
        amountText: "",
        amountCents: null,
        sellAll: false
      };
      tradeError = "";
      state.view = "trade";
      persistAll();
      render();
    }

    function setDraftAmount(cents, text, sellAll) {
      tradeDraft.sellAll = !!sellAll;
      if (sellAll) {
        const price = livePrice(tradeDraft.coin);
        const value = price ? holdingValueCents(tradeDraft.coin, price) : 0;
        tradeDraft.amountCents = value;
        tradeDraft.amountText = (value / 100).toFixed(2);
      } else {
        tradeDraft.amountCents = cents;
        tradeDraft.amountText = text != null ? text : (cents / 100).toFixed(2);
      }
      tradeError = "";
    }

    function confirmDraft() {
      if (!tradeDraft) return;
      if (!canTrade()) {
        tradeError = "Prices are updating, please wait a moment.";
        render();
        return;
      }
      const price = livePrice(tradeDraft.coin);
      if (tradeDraft.side === "buy") {
        const cents = tradeDraft.amountCents != null ? tradeDraft.amountCents : parseDollarInput(tradeDraft.amountText);
        if (cents == null) {
          tradeError = "Please enter a dollar amount, like 100.";
          render();
          return;
        }
        const preview = previewBuy(tradeDraft.coin, cents, price);
        if (!preview.ok) {
          tradeError = preview.error;
          render();
          return;
        }
        tradeDraft.amountCents = cents;
        tradeDraft.preview = preview;
        tradeDraft.price = price;
      } else {
        if (tradeDraft.sellAll) {
          const preview = previewSell(tradeDraft.coin, 0, price, true);
          if (!preview.ok) {
            tradeError = preview.error;
            render();
            return;
          }
          tradeDraft.preview = preview;
          tradeDraft.price = price;
        } else {
          const cents = tradeDraft.amountCents != null ? tradeDraft.amountCents : parseDollarInput(tradeDraft.amountText);
          if (cents == null) {
            tradeError = "Please enter a dollar amount, like 100.";
            render();
            return;
          }
          const preview = previewSell(tradeDraft.coin, cents, price, false);
          if (!preview.ok) {
            tradeError = preview.error;
            if (preview.offerAll != null) tradeError = "Sell all (" + formatDollars(preview.offerAll) + ")";
            render();
            return;
          }
          tradeDraft.amountCents = cents;
          tradeDraft.preview = preview;
          tradeDraft.price = price;
        }
      }
      state.view = "confirm";
      persistAll();
      render();
    }

    function previewBuy(coin, amountCents, price) {
      // Pure check without mutating — reuse apply on a copy? Simpler to duplicate checks.
      if (amountCents < MIN_TRADE_CENTS) return { ok: false, error: "The smallest trade is $1.00." };
      if (amountCents > wallet.cashCents) return { ok: false, error: "You only have " + formatDollars(wallet.cashCents) + " in cash." };
      if (!price || price <= 0) return { ok: false, error: "Prices are updating, please wait a moment." };
      const feeCents = feeOn(amountCents);
      const units = buyUnits(amountCents - feeCents, price);
      if (units <= 0) return { ok: false, error: "The smallest trade is $1.00." };
      return { ok: true, feeCents, units, amountCents, price, coin, side: "buy" };
    }

    function previewSell(coin, amountCents, price, sellAll) {
      const held = wallet.coins[coin].units;
      if (held <= 0) return { ok: false, error: "You don’t have any " + COIN_NAME[coin] + " to sell." };
      if (!price || price <= 0) return { ok: false, error: "Prices are updating, please wait a moment." };
      const valueCents = holdingValueCents(coin, price);
      let units;
      if (sellAll) units = held;
      else {
        if (amountCents < MIN_TRADE_CENTS) return { ok: false, error: "The smallest trade is $1.00." };
        if (amountCents > valueCents) return { ok: false, error: "Sell all (" + formatDollars(valueCents) + ")", offerAll: valueCents };
        units = buyUnits(amountCents, price);
        if (units > held) units = held;
        if (units <= 0) return { ok: false, error: "The smallest trade is $1.00." };
      }
      const proceedsCents = sellProceedsCents(units, price);
      const feeCents = feeOn(proceedsCents);
      return { ok: true, feeCents, units, amountCents: sellAll ? proceedsCents : amountCents, proceedsCents, price, coin, side: "sell", sellAll: !!sellAll };
    }

    function submitConfirm() {
      if (!tradeDraft) return;
      // Re-check staleness at Yes.
      if (!canTrade()) {
        tradeError = "Prices are updating, please wait a moment. The trade was not placed.";
        state.view = "trade";
        render();
        return;
      }
      const price = livePrice(tradeDraft.coin);
      let result;
      if (tradeDraft.side === "buy") {
        result = applyBuy(tradeDraft.coin, tradeDraft.amountCents, price);
      } else {
        result = applySell(tradeDraft.coin, tradeDraft.amountCents || 0, price, !!tradeDraft.sellAll);
      }
      if (!result.ok) {
        tradeError = result.error;
        state.view = "trade";
        persistWallet();
        render();
        return;
      }
      tradeDraft = null;
      tradeError = "";
      state.view = "wallet";
      persistWallet();
      recordSnapshot(true);
      render();
    }

    function confirmSentence(preview) {
      const name = COIN_NAME[preview.coin];
      if (preview.side === "buy") {
        return "Buy " + formatDollars(preview.amountCents) + " of " + name + " at " + formatPrice(preview.price) + ". Fee: " + formatDollars(preview.feeCents) + ". You’ll get about " + formatCoins(preview.units) + " " + name + ".";
      }
      const cashBack = preview.proceedsCents - preview.feeCents;
      if (preview.sellAll) {
        return "Sell all your " + name + " at " + formatPrice(preview.price) + " for " + formatDollars(preview.proceedsCents) + ". Fee: " + formatDollars(preview.feeCents) + ". You’ll get " + formatDollars(cashBack) + " back in cash.";
      }
      return "Sell " + formatDollars(preview.amountCents) + " of " + name + " at " + formatPrice(preview.price) + ". Fee: " + formatDollars(preview.feeCents) + ". You’ll get about " + formatDollars(cashBack) + " back in cash.";
    }

    function gainLine(id, price) {
      const c = wallet.coins[id];
      if (!c.units || !price) return "";
      const value = holdingValueCents(id, price);
      const unreal = value - c.costCents;
      const pct = c.costCents > 0 ? (unreal / c.costCents) * 100 : 0;
      const pctText = (Math.abs(pct)).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const word = unreal > 0 ? "up" : unreal < 0 ? "down" : "even";
      const arrow = unreal > 0 ? "▲" : unreal < 0 ? "▼" : "•";
      const cls = unreal > 0 ? "up" : "down";
      const avg = c.units ? (c.costCents * 1e6 / c.units) : 0;
      const avgText = "$" + avg.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const signAmt = formatDollars(unreal, { sign: true });
      const signPct = (unreal > 0 ? "+" : unreal < 0 ? "−" : "") + pctText + "%";
      return `<p>Average cost ${avgText}.</p><p><span class="gain ${cls}">${word} ${arrow} ${signAmt} (${signPct})</span></p>`;
    }

    // ---------- Slice 2b: Summary tab and on-device performance history ----------
    const HIST_KEY = "crypto-grandma-v1-history";
    const SNAP_GAP_MS = 5 * 60 * 1000;
    const HOUR_MS = 60 * 60 * 1000;
    const DAY_MS = 24 * HOUR_MS;
    const HIST_CAP = 1500;
    const RANGES = {
      "1D": { ms: DAY_MS, label: "One day", phrase: "Over the past day", left: "A day ago" },
      "1W": { ms: 7 * DAY_MS, label: "One week", phrase: "Over the past week", left: "A week ago" },
      "1M": { ms: 30 * DAY_MS, label: "One month", phrase: "Over the past month", left: "A month ago" },
      "All": { ms: null, label: "All time", phrase: "Since you started", left: "" }
    };
    let fakeNow = null;
    let summaryRange = "1W";
    let perfHistory = loadHistory();

    function nowMs() { return fakeNow != null ? fakeNow : Date.now(); }

    function loadHistory() {
      try {
        const raw = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
        if (!Array.isArray(raw)) return [];
        return raw.filter((p) => p && Number.isFinite(p.t) && Number.isInteger(p.worthCents))
          .sort((a, b) => a.t - b.t);
      } catch (e) {
        return [];
      }
    }

    function saveHistory() {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(perfHistory)); } catch (e) { /* storage full: keep in memory */ }
    }

    // Full detail for 2 days, one point per hour up to 2 months, one per day beyond. Keeps the last point in each bucket.
    function compactHistory() {
      const now = nowMs();
      perfHistory.sort((a, b) => a.t - b.t);
      const keep = [];
      const seen = new Map();
      for (let i = perfHistory.length - 1; i >= 0; i--) {
        const p = perfHistory[i];
        const age = now - p.t;
        let key = null;
        if (age > 60 * DAY_MS) key = "d" + Math.floor(p.t / DAY_MS);
        else if (age > 2 * DAY_MS) key = "h" + Math.floor(p.t / HOUR_MS);
        if (key && !p.marker) {
          if (seen.has(key)) continue;
          seen.set(key, true);
        }
        keep.push(p);
      }
      keep.reverse();
      perfHistory = keep.length > HIST_CAP ? keep.slice(keep.length - HIST_CAP) : keep;
    }

    function currentPoint(t) {
      return {
        t,
        worthCents: totalWorthCents(),
        cashCents: wallet.cashCents,
        btcUnits: wallet.coins.btc.units,
        ethUnits: wallet.coins.eth.units
      };
    }

    function haveWorthForHoldings() {
      for (const id of ["btc", "eth"]) {
        if (wallet.coins[id].units > 0 && !lastPrice(id)) return false;
      }
      return true;
    }

    // force: after a trade, Undo or Start over. Otherwise at most one point every 5 minutes.
    function recordSnapshot(force) {
      if (!haveWorthForHoldings()) return false;
      const t = nowMs();
      const last = perfHistory[perfHistory.length - 1];
      if (!force && last && t - last.t < SNAP_GAP_MS) return false;
      perfHistory.push(currentPoint(t));
      compactHistory();
      saveHistory();
      return true;
    }

    function onPricesRefreshed() { return recordSnapshot(false); }

    function resetHistory() {
      const p = currentPoint(nowMs());
      p.marker = true;
      perfHistory = [p];
      saveHistory();
    }

    function addSnapshotAt(tMs, overrides) {
      const p = Object.assign(currentPoint(tMs), overrides || {});
      perfHistory.push(p);
      compactHistory();
      saveHistory();
      return p;
    }

    // A gentle rise, a dip, then a recovery, ending at today's worth. For screenshots and tests.
    function seedHistory(days, pattern) {
      const now = nowMs();
      const start = now - days * DAY_MS;
      const endWorth = totalWorthCents();
      const base = START_CASH_CENTS;
      const amp = Math.round(base * 0.015);
      const step = HOUR_MS;
      const pts = [];
      for (let t = start; t <= now; t += step) {
        const x = (t - start) / (now - start);
        let shape;
        if (pattern === "flat") shape = 0;
        else if (x < 0.45) shape = Math.sin((x / 0.45) * Math.PI / 2) * 1.0;
        else if (x < 0.7) shape = 1.0 - 2.2 * Math.sin(((x - 0.45) / 0.25) * Math.PI / 2);
        else shape = -1.2 + 1.2 * Math.sin(((x - 0.7) / 0.3) * Math.PI / 2);
        const wobble = Math.sin(t / (9 * HOUR_MS)) * 0.025;
        const worth = Math.round(base + (endWorth - base) * x + amp * (shape + (x > 0 && x < 1 ? wobble : 0)));
        pts.push({ t, worthCents: worth, cashCents: wallet.cashCents, btcUnits: wallet.coins.btc.units, ethUnits: wallet.coins.eth.units });
      }
      pts[0].marker = true;
      pts[0].worthCents = base;
      pts[pts.length - 1].worthCents = endWorth;
      pts[pts.length - 1].t = now;
      perfHistory = pts;
      compactHistory();
      saveHistory();
      return perfHistory.length;
    }

    function localMidnight(ms) {
      const d = new Date(ms);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    function rangePoints(key) {
      const r = RANGES[key];
      const now = nowMs();
      if (!r.ms) return perfHistory.slice();
      return perfHistory.filter((p) => p.t >= now - r.ms && p.t <= now);
    }

    function rangeChange(key) {
      const pts = rangePoints(key);
      if (pts.length < 2) return null;
      const first = pts[0].worthCents;
      const last = pts[pts.length - 1].worthCents;
      return { cents: last - first, pct: first ? (last - first) / first * 100 : 0, from: first, to: last, points: pts.length };
    }

    // Shares that always add up to 100 (largest remainder).
    function allocationPct(parts) {
      const total = parts.reduce((a, b) => a + b, 0);
      if (total <= 0) return parts.map((_, i) => (i === 0 ? 100 : 0));
      const raw = parts.map((v) => v / total * 100);
      const floor = raw.map(Math.floor);
      let left = 100 - floor.reduce((a, b) => a + b, 0);
      raw.map((v, i) => [v - floor[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => {
        if (left > 0) { floor[i] += 1; left -= 1; }
      });
      return floor;
    }

    function summaryData() {
      const worth = totalWorthCents();
      const now = nowMs();
      const gain = worth - START_CASH_CENTS;
      const today = perfHistory.filter((p) => p.t >= localMidnight(now) && p.t <= now);
      let todayChangeCents = null;
      let todayChangePct = null;
      if (today.length >= 2 || (today.length === 1 && now - today[0].t >= SNAP_GAP_MS)) {
        todayChangeCents = worth - today[0].worthCents;
        todayChangePct = today[0].worthCents ? todayChangeCents / today[0].worthCents * 100 : 0;
      }
      const btcV = lastPrice("btc") ? holdingValueCents("btc", lastPrice("btc")) : 0;
      const ethV = lastPrice("eth") ? holdingValueCents("eth", lastPrice("eth")) : 0;
      const [cash, btc, eth] = allocationPct([wallet.cashCents, btcV, ethV]);
      const rc = {};
      for (const k of Object.keys(RANGES)) {
        const c = rangeChange(k);
        rc[k] = c ? c.cents : null;
      }
      return {
        worthCents: worth,
        totalGainCents: gain,
        totalGainPct: gain / START_CASH_CENTS * 100,
        todayChangeCents,
        todayChangePct,
        allocation: { cash, btc, eth },
        values: { cash: wallet.cashCents, btc: btcV, eth: ethV },
        rangeChange: rc
      };
    }

    function pctString(pct) {
      const a = Math.abs(pct);
      if (a > 0 && a < 0.1) return a.toFixed(2) + "%";
      return a.toFixed(1) + "%";
    }

    function changeChip(cents, pct) {
      const word = cents > 0 ? "up" : cents < 0 ? "down" : "even";
      const arrow = cents > 0 ? "▲" : cents < 0 ? "▼" : "•";
      const cls = cents > 0 ? "up" : "down";
      const sign = cents > 0 ? "+" : cents < 0 ? "−" : "";
      return `<span class="gain ${cls}">${word} ${arrow} ${formatDollars(cents, { sign: true })} (${sign}${pctString(pct)})</span>`;
    }

    function rangeSentence(key, c) {
      const r = RANGES[key];
      if (!c) return "";
      if (c.cents === 0) return `${r.phrase} your pretend money stayed even at ${formatDollars(c.to)}.`;
      const dir = c.cents > 0 ? "went up" : "went down";
      return `${r.phrase} your pretend money ${dir} ${formatDollars(Math.abs(c.cents))} (${pctString(c.pct)}).`;
    }

    function walletTop(active) {
      const tab = (id, label) => `<button class="tab" type="button" role="tab" data-tab="${id}" aria-selected="${active === id}" ${active === id ? 'aria-current="page"' : ""}>${active === id ? '<span class="tab-mark" aria-hidden="true">●</span> ' : ""}${label}</button>`;
      return `
        <div class="chrome-top">
          <div class="top-row wallet-top">
            <button class="btn-back" type="button" data-back>◀ Back</button>
            <p class="pretend">Pretend money</p>
          </div>
          <div class="tabs" role="tablist" aria-label="Practice wallet pages">
            ${tab("wallet", "Wallet")}
            ${tab("summary", "Summary")}
          </div>
        </div>`;
    }

    function holdingsTable() {
      const DOT = { Bitcoin: "btc", Ethereum: "eth", Cash: "cash" };
      const row = (name, amount, avg, value, gainHtml) => {
        const na = (v) => (v === "—" ? " na" : "");
        return `<tr>
          <th scope="row" data-label="Coin"><span class="coin-cell"><span class="dot dot-${DOT[name]}" aria-hidden="true"></span>${name}</span></th>
          <td data-label="You own" class="${na(amount).trim()}">${amount}</td>
          <td data-label="Average cost" class="${na(avg).trim()}">${avg}</td>
          <td data-label="Worth now" class="num">${value}</td>
          <td data-label="Gain or loss" class="${na(gainHtml).trim()}">${gainHtml}</td>
        </tr>`;
      };
      const coinRow = (id) => {
        const c = wallet.coins[id];
        const price = lastPrice(id);
        if (!c.units) return row(COIN_NAME[id], "None", "—", formatDollars(0), "—");
        const avgCents = Math.round(c.costCents * 1e8 / c.units);
        const value = price ? holdingValueCents(id, price) : null;
        const g = value != null ? value - c.costCents : null;
        const gainHtml = g == null ? "Price updating" : changeChip(g, c.costCents ? g / c.costCents * 100 : 0);
        return row(COIN_NAME[id], formatCoins(c.units), formatDollars(avgCents), value != null ? formatDollars(value) : "Price updating", gainHtml);
      };
      return `<table class="hold-table">
        <caption class="sr-only">What you own</caption>
        <thead><tr><th scope="col">Coin</th><th scope="col">Amount</th><th scope="col">Average cost</th><th scope="col">Value now</th><th scope="col">Gain or loss</th></tr></thead>
        <tbody>
          ${coinRow("btc")}
          ${coinRow("eth")}
          ${row("Cash", "—", "—", formatDollars(wallet.cashCents), "—")}
        </tbody>
      </table>`;
    }

    function allocationBlock(s) {
      const parts = [
        { id: "cash", name: "Cash", pct: s.allocation.cash },
        { id: "btc", name: "Bitcoin", pct: s.allocation.btc },
        { id: "eth", name: "Ethereum", pct: s.allocation.eth }
      ];
      const text = parts.map((p) => `${p.name} ${p.pct}%`).join(" · ");
      const visual = [parts[1], parts[2], parts[0]];
      const bar = visual.filter((p) => p.pct > 0).map((p) =>
        `<span class="seg seg-${p.id}" style="width:${p.pct}%" data-pct="${p.pct}" title="${p.name} ${p.pct}%">${p.pct >= 12 ? `<span class="seg-label">${p.name}</span>` : ""}</span>`
      ).join("");
      const legend = visual.map((p) => `<li><span class="swatch seg-${p.id}" aria-hidden="true"></span><span class="l-name">${p.id === "cash" ? "Cash you can use" : p.name}</span><span class="l-val"><b>${p.pct}%</b> · ${formatDollars(s.values[p.id])}</span></li>`).join("");
      return `<h2 class="wallet-h">How your money is split</h2>
        <div class="alloc-bar" role="img" aria-label="${escapeHtml(text)}">${bar}</div>
        <p class="alloc-text sr-only" data-alloc-text>${escapeHtml(text)}</p>
        <ul class="alloc-legend" aria-hidden="true">${legend}</ul>`;
    }

    function chartBlock() {
      const key = summaryRange;
      const r = RANGES[key];
      const pts = rangePoints(key);
      const buttons = Object.keys(RANGES).map((k) =>
        `<button class="range-btn" type="button" data-range="${k}" aria-pressed="${k === key}" aria-label="${RANGES[k].label}">${k}</button>`
      ).join("");
      let body;
      if (pts.length < 2) {
        body = `<div class="chart-empty"><p>Your chart will fill in as you visit. Check back tomorrow.</p></div>`;
      } else {
        const now = nowMs();
        const t0 = r.ms ? now - r.ms : pts[0].t;
        const t1 = r.ms ? now : pts[pts.length - 1].t;
        const vals = pts.map((p) => p.worthCents).concat([START_CASH_CENTS]);
        let lo = Math.min.apply(null, vals);
        let hi = Math.max.apply(null, vals);
        const pad = Math.max(Math.round((hi - lo) * 0.12), 500);
        lo -= pad; hi += pad;
        const W = 600, H = 240;
        const x = (t) => ((t - t0) / Math.max(1, t1 - t0)) * W;
        const y = (v) => H - ((v - lo) / (hi - lo)) * H;
        const d = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.worthCents).toFixed(1)).join(" ");
        const by = y(START_CASH_CENTS).toFixed(1);
        const c = rangeChange(key);
        const left = r.left || new Date(pts[0].t).toLocaleDateString("en-US", { month: "short", day: "numeric" });
        body = `<div class="chart-wrap">
            <div class="chart-axis"><span>${formatDollars(Math.round(hi / 100) * 100)}</span><span>${formatDollars(Math.round(lo / 100) * 100)}</span></div>
            <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${escapeHtml(rangeSentence(key, c))}">
              <defs><linearGradient id="cg-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1FB8" stop-opacity="0.12"/><stop offset="1" stop-color="#2A1FB8" stop-opacity="0"/></linearGradient></defs>

    function runCases() {

        `cash=${wallet.cashCents} units=${wallet.coins.btc.units} undone=${wallet.history[0] && wallet.history[0].undone}`);

      // 7
      wallet = defaultWallet();
      acceptPrices({ btc: 60000, eth: 2000, source: "test" }, Date.now() - 121000);
      const disabled = !canTrade();
      pass(7, disabled === true, "stale disables trades: " + disabled);

      // 8
      acceptPrices({ btc: 60000, eth: 2000, source: "test" }, Date.now());
      prices.pinned = false;
      feedControl = { coinbaseDown: true, geckoDown: false };
      // Simulate gecko success by setting after a fake refresh path:
      // We call the inner accept via a stubbed path. Directly test the branches:
      let partA = false, partB = false;
      // With gecko working we can acceptPrices from gecko
      try {
        // cannot hit network reliably in all QA; honor failFeeds flags and getState
        prices.btc = null; prices.eth = null; prices.error = null;
        feedControl = { coinbaseDown: true, geckoDown: false };
        // If gecko isn't actually called, set as the refresh function would
        // We'll run the real refresh if possible; otherwise emulate the control flags.
      } catch (e) {}
      // Synchronous assertion of flag behavior + message:
      feedControl = { coinbaseDown: true, geckoDown: true };
      prices = { btc: null, eth: null, error: "both", pinned: true };
      const msg = walletNotice();
      const noTrade = !canTrade();
      partB = msg && msg.text === "We can't get prices right now. Your practice money is safe. Try again later." && noTrade;
      // coinbase down, gecko working: prices can still load
      prices = { btc: { value: 60000, fetchedAt: Date.now(), source: "coingecko" }, eth: { value: 2000, fetchedAt: Date.now(), source: "coingecko" }, error: null, pinned: true };
      feedControl = { coinbaseDown: true, geckoDown: false };
      partA = canTrade() === true;
      pass(8, partA && partB, `geckoOk=${partA} bothFail=${partB}`);

      // 9
      wallet = defaultWallet();
      wallet.history = [];
      r = applyBuy("btc", 10000, 60000);
      r = applyBuy("btc", 10000, 50000);
      const avg = wallet.coins.btc.units ? (wallet.coins.btc.costCents * 1e6 / wallet.coins.btc.units) : 0;
      pass(9, wallet.coins.btc.units === 364833 && wallet.coins.btc.costCents === 20000 && Math.abs(avg - 54819.60) < 0.005,
        `units=${wallet.coins.btc.units} cost=${wallet.coins.btc.costCents} avg=${avg.toFixed(2)}`);

      // 10

      state.done = { "what-is-bitcoin": true };

        `cash=${wallet.cashCents} history=${wallet.history.length} lessonDone=${state.done["what-is-bitcoin"]}`);

      // Restore
      restoreSnapshot(savedWallet);

      feedControl = savedFeed;
      state.started = savedLessons.started;
      state.done = savedLessons.done;

      state.progress = savedLessons.progress;

      return results;

    if (_pendingWallet) {

    const LESSON_GROUPS = [
      { label: "THE BASICS", from: 0, to: 4 },
      { label: "KEEPING MONEY SAFE", from: 4, to: 7 },
      { label: "ETHEREUM", from: 7, to: 11 },
      { label: "PRACTICE", from: 11, to: 12 }
    ];

    // Status text for one lesson given a state object (never colour alone).
    function lessonStatusFor(st, lesson) {
      if (st.done && st.done[lesson.id]) return "Done";
      const saved = (st.progress && st.progress[lesson.id]) || null;
      const started = !!(st.started && st.started[lesson.id]);
      if (!started && !saved) return "Not started";
      const view = saved && saved.view;
      const n = lesson.screens.length;
      if (view === "quiz" || view === "complete" || (view === "lesson" && (saved.screen || 0) >= n)) {
        const q = Math.min((saved && saved.quizIndex) || 0, lesson.quiz.length - 1) + 1;
        return "Quiz, question " + q + " of " + lesson.quiz.length;
      }
      const sc = Math.min((saved && saved.screen) || 0, n - 1) + 1;
      return sc + " of " + n + " screens";
    }

    function nextLessonFor(st) {
      return lessons.find((l) => !(st.done && st.done[l.id])) || null;
    }

    function doneCountFor(st) {
      return lessons.filter((l) => st.done && st.done[l.id]).length;
    }

    function renderHome() {
      const next = nextLessonFor(state);
      const finished = doneCountFor(state);
      const row = (lesson, i) => {
        const done = !!state.done[lesson.id];
        const isNext = !!next && next.id === lesson.id;
        const status = lessonStatusFor(state, lesson);
        const cls = "lesson-card" + (done ? " is-done" : "") + (isNext ? " is-next" : "");
        return `<li>
          <button class="${cls}" type="button" data-open="${lesson.id}" data-lesson-number="${i + 1}">
            <span class="num" aria-hidden="true">${done ? "✓" : i + 1}</span>
            <span class="lesson-text">
              <span class="sr-only">Lesson ${i + 1}: </span>
              <span class="lesson-title">${escapeHtml(lesson.title)}</span>
              <span class="lesson-status">${escapeHtml(status)}</span>
              ${isNext ? `<span class="chip">${status === "Not started" ? "Start here" : "Continue here"}</span>` : ""}
            </span>
            <span class="chev" aria-hidden="true">▶</span>
          </button>
        </li>`;
      };
      const groups = LESSON_GROUPS.map((g, gi) => {
        const rows = lessons.slice(g.from, g.to).map((l, k) => row(l, g.from + k)).join("");
        if (!rows) return "";
        return `<section class="group" aria-labelledby="group-${gi}">
          <h3 class="group-label" id="group-${gi}">${g.label}</h3>
          <ul class="lesson-list">${rows}</ul>
        </section>`;
      }).join("");
      const pct = Math.round(finished / lessons.length * 100);
      const label = "You've finished " + finished + " of " + lessons.length + " lessons";

      return `
        <div class="pane">
          <h2 class="sr-only">Lessons</h2>

            <p class="progress-label" data-progress-card>${label}</p>

          </div>
          ${groups}
        </div>
      `;
    }

    function progressBlock(label, ratio, lesson) {
      const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      const over = lesson ? `<p class="overline">Lesson ${lessonIndex(lesson.id) + 1} of ${lessons.length}</p>` : "";
      return `<div class="progress-wrap">
        ${over}
        <p class="progress-label">${escapeHtml(label)}</p>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${escapeHtml(label)}"><span style="width:${pct}%"></span></div>

    function renderLesson() {

    function renderQuiz() {
      const lesson = lessonById(state.lessonId);
      const q = lesson.quiz[state.quizIndex];
      const total = lesson.quiz.length;
      const n = state.quizIndex + 1;
      const options = q.options.map((opt, i) => {
        let cls = "option";
        const pressed = state.selected === i;
        if (state.revealed) {
          if (i === q.answer) cls += " is-correct";
          else if (pressed && i !== q.answer) cls += " is-wrong";
        }
        const mark = state.revealed && i === q.answer ? " ✓" : (state.revealed && pressed && i !== q.answer ? " ✗" : "");
        return `<button class="${cls}" type="button" data-choose="${i}" aria-pressed="${pressed}" ${state.revealed ? "disabled" : ""}>${escapeHtml(opt)}${mark}</button>`;
      }).join("");

      let feedback = "";
      if (state.revealed) {
        const ok = state.selected === q.answer;
        feedback = `<div class="feedback ${ok ? "correct" : "wrong"}" role="status">
          <strong>${ok ? "✓ That's right" : "Not quite. Here's why…"}</strong>
