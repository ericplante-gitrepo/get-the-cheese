        render();
      });
      const sellAllBtn = root.querySelector("[data-sell-all]");
      if (sellAllBtn) sellAllBtn.addEventListener("click", () => {
        setDraftAmount(null, "", true);
        render();
      });
      const sellAllOffer = root.querySelector("[data-sell-all-offer]");
      if (sellAllOffer) sellAllOffer.addEventListener("click", () => {
        setDraftAmount(null, "", true);
        render();
      });
      const amountInput = root.querySelector("#amount");
      if (amountInput) {
        amountInput.addEventListener("input", () => {
          if (!tradeDraft) return;
          tradeDraft.sellAll = false;
          tradeDraft.amountText = amountInput.value;
          tradeDraft.amountCents = parseDollarInput(amountInput.value);
          tradeError = "";
        });
      }
      const reviewBtn = root.querySelector("[data-review]");
      if (reviewBtn) reviewBtn.addEventListener("click", confirmDraft);
      const yesTrade = root.querySelector("[data-yes-trade]");
      if (yesTrade) yesTrade.addEventListener("click", submitConfirm);
      const noTrade = root.querySelector("[data-no-trade]");
      if (noTrade) noTrade.addEventListener("click", () => {
        state.view = "trade";
        persistAll();
        render();
      });

      const focusTarget = root.querySelector(".btn-primary, .quiz-q, .lesson-card, h2");
      if (focusTarget && state.view !== "home") {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) focusTarget.focus({ preventScroll: true });
      }
      if (state.revealed) {
        const chosen = root.querySelector(".option[aria-pressed=\"true\"]");
        if (chosen) chosen.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
        const fb = root.querySelector(".feedback");
        if (fb) fb.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "auto" });
      }
    }

    function resetLessonProgressAll() { for (const k of Object.keys(lessonProgress)) delete lessonProgress[k]; }

    window.__cfg = {
      reset() {
        localStorage.removeItem(STORAGE_KEY);
        stopPolling();
        state = defaultState();
        wallet = defaultWallet();
        prices = defaultPrices();
        tradeDraft = null;
        tradeError = "";
        for (const k of Object.keys(lessonProgress)) delete lessonProgress[k];
        perfHistory = [];
        fakeNow = null;
        summaryRange = "1W";
        localStorage.removeItem(HIST_KEY);
        render();
      },
      state() { return state; }
    };

    window.__test = {
      getState() {
        return {
          view: state.view,
          cashCents: wallet.cashCents,
          coins: {
            btc: { units: wallet.coins.btc.units, costCents: wallet.coins.btc.costCents },
            eth: { units: wallet.coins.eth.units, costCents: wallet.coins.eth.costCents }
          },
          history: wallet.history.map((h) => ({
            type: h.type, coin: h.coin, amountCents: h.amountCents, feeCents: h.feeCents,
            units: h.units, price: h.price, proceedsCents: h.proceedsCents,
            realizedCents: h.realizedCents, text: h.text, undone: h.undone
          })),
          prices: {
            btc: prices.btc && { value: prices.btc.value, fetchedAt: prices.btc.fetchedAt, source: prices.btc.source },
            eth: prices.eth && { value: prices.eth.value, fetchedAt: prices.eth.fetchedAt, source: prices.eth.source },
            error: prices.error
          },
          canTrade: canTrade(),
          started: state.started,
          done: state.done,
          answers: state.answers,
          progress: state.progress
        };
      },
      setPrices(p) {
        const at = p.fetchedAt != null ? p.fetchedAt : Date.now();
        prices.pinned = true;
        prices.error = null;
        if (p.btc != null) prices.btc = { value: p.btc, fetchedAt: at, source: "test" };
        if (p.eth != null) prices.eth = { value: p.eth, fetchedAt: at, source: "test" };
        onPricesRefreshed();
        if (isWalletView(state.view)) render();
      },
      failFeeds(which) {
        if (which === "both") {
          feedControl = { coinbaseDown: true, geckoDown: true };
          prices.pinned = true;
          prices.error = "both";
        } else if (which === "coinbase") {
          feedControl = { coinbaseDown: true, geckoDown: false };
          prices.pinned = false;
        } else if (which === "coingecko") {
          feedControl = { coinbaseDown: false, geckoDown: true };
        } else if (which === "none" || which == null) {
          feedControl = { coinbaseDown: false, geckoDown: false };
          prices.pinned = false;
        }
        if (isWalletView(state.view)) render();
      },
      buy(coin, dollars) {
        const cents = typeof dollars === "number" && Number.isInteger(dollars) && dollars >= 100
          ? (dollars > 100000 ? dollars : Math.round(dollars * 100))
          : parseDollarInput(String(dollars));
        // Prefer dollars as a money amount: 100 -> $100, 10000 as $100.00 if clearly cents? 
        // Hook: buy(coin, dollars). 100 means $100.00.
        const amountCents = Math.round(Number(dollars) * 100);
        const price = livePrice(coin) || (prices[coin] && prices[coin].value);
        const result = applyBuy(coin, amountCents, price);
        if (result.ok) { persistWallet(); recordSnapshot(true); }
        if (isWalletView(state.view)) render();
        return result;
      },
      sell(coin, dollars) {
        const amountCents = Math.round(Number(dollars) * 100);
        const price = livePrice(coin) || (prices[coin] && prices[coin].value);
        const result = applySell(coin, amountCents, price, false);
        if (result.ok) { persistWallet(); recordSnapshot(true); }
        if (isWalletView(state.view)) render();
        return result;
      },
      sellAll(coin) {
        const price = livePrice(coin) || (prices[coin] && prices[coin].value);
        const result = applySell(coin, 0, price, true);
        if (result.ok) { persistWallet(); recordSnapshot(true); }
        if (isWalletView(state.view)) render();
        return result;
      },
      undo() {
        const result = applyUndo();
        if (result.ok) { persistWallet(); recordSnapshot(true); }
        if (isWalletView(state.view)) render();
        return result;
      },
      startOver() {
        const result = applyStartOver();
        resetHistory();
        persistWallet();
        if (isWalletView(state.view)) render();
        return result;
      },
      setHoldings(coin, units, costCents) {
        wallet.coins[coin].units = units;
        wallet.coins[coin].costCents = costCents;
        persistWallet();
      },
      getHistory() { return perfHistory.map((h) => Object.assign({}, h)); },
      addSnapshot(tMs, overrides) { return addSnapshotAt(tMs, overrides); },
      seedHistory(days, pattern) { const n = seedHistory(days, pattern); if (isWalletView(state.view)) render(); return n; },
      clearHistory() { perfHistory = []; saveHistory(); if (isWalletView(state.view)) render(); },
      setNow(ms) { fakeNow = ms == null ? null : ms; if (isWalletView(state.view)) render(); },
      summary() { return summaryData(); },
      formatPrice(v) { return formatPrice(v); },
      listLessons() {
        return lessons.map((l, i) => ({ number: i + 1, id: l.id, title: l.title, screens: l.screens.length, quiz: l.quiz.length }));
      },
      lessonsData() { return JSON.parse(JSON.stringify(LESSONS)); },
      // Writes a 3-lesson-era (v1-shaped) crypto-grandma-v1 state, with a funded wallet and history,
      // so a page reload can show the migration. variant "done3" = lessons 1-3 done; "mid" = 1-2 done, lesson 3 open on screen 4; "midhome" = same progress but sitting on the home list.
      seedV1Progress(variant) {
        const v = variant === "mid" || variant === "midhome" ? variant : "done3";
        const all = { "what-is-bitcoin": { 0: 2, 1: 1, 2: 1 }, "spotting-scams": { 0: 1, 1: 1, 2: 1 }, "buying-and-selling": { 0: 0, 1: 1, 2: 1 } };
        state = defaultState();
        resetLessonProgressAll();
        state.started = { "what-is-bitcoin": true, "spotting-scams": true, "buying-and-selling": true };
        if (v === "done3") {
          state.done = { "what-is-bitcoin": true, "spotting-scams": true, "buying-and-selling": true };
          state.answers = all;
          state.progress = {
            "what-is-bitcoin": { screen: 6, quizIndex: 2, selected: 1, revealed: true, view: "quiz" },
            "spotting-scams": { screen: 7, quizIndex: 2, selected: 1, revealed: true, view: "quiz" },
            "buying-and-selling": { screen: 6, quizIndex: 2, selected: 1, revealed: true, view: "quiz" }
          };
        } else {
          state.done = { "what-is-bitcoin": true, "spotting-scams": true };
          state.answers = { "what-is-bitcoin": all["what-is-bitcoin"], "spotting-scams": all["spotting-scams"], "buying-and-selling": {} };
          state.progress = { "buying-and-selling": { screen: 3, quizIndex: 0, selected: null, revealed: false, view: "lesson" } };
          if (v === "mid") { state.view = "lesson"; state.lessonId = "buying-and-selling"; state.screen = 3; }
        }
        Object.assign(lessonProgress, state.progress);
        wallet = defaultWallet(); wallet.history = [];
        prices = defaultPrices(); prices.pinned = true;
        acceptPrices({ btc: 60000, eth: 2000, source: "test" }, Date.now());
        applyBuy("btc", 10000, 60000);
        applyBuy("eth", 10000, 2000);
        fakeNow = null; perfHistory = [];
        seedHistory(5);
        saveState();
        saveHistory();
        render();
        return { variant: v, cashCents: wallet.cashCents, btcUnits: wallet.coins.btc.units, ethUnits: wallet.coins.eth.units, done: Object.keys(state.done), raw: localStorage.getItem(STORAGE_KEY) };
      },
      runCases() {
        const results = runCases().concat(runDashboardCases(), runLessonCases());
        const lines = results.map((r) => (r.ok ? "PASS" : "FAIL") + " " + r.n + " " + r.detail);
        const all = results.every((r) => r.ok);
        const text = lines.join("\n") + "\n" + (all ? "ALL PASS" : "SOME FAILED");
        console.log(text);
        return { all, results, text };
      }
    };

    if (isWalletView(state.view)) startPolling();
    render();
  </script>
</body>
</html>
